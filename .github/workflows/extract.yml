name: Extract Ballard Bank ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o BALLARD_BANK_MULTIPLAYER_V1.zip -d .
          rm BALLARD_BANK_MULTIPLAYER_V1.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract BALLARD BANK project" || true
          git push
